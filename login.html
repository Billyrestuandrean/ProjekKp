<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>

    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:
      linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.7)),
      url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?q=80&w=1400');
      background-size:cover;
      font-family:Arial;
    }

    .login-box{
      width:400px;
      background:rgba(255,255,255,.1);
      backdrop-filter:blur(15px);
      padding:40px;
      border-radius:20px;
      color:white;
      box-shadow:0 10px 30px rgba(0,0,0,.3);
      animation:show .7s ease;
    }

    @keyframes show{
      from{
        opacity:0;
        transform:translateY(-40px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .login-box h1{
      text-align:center;
      margin-bottom:30px;
    }

    .input-group{
      margin-bottom:20px;
      position:relative;
    }

    .input-group input{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      outline:none;
      color: #004080;
    }

    .login-btn{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#005bac;
      color:white;
      font-weight:bold;
      cursor:pointer;
      transition:.3s;
    }

    .login-btn:hover{
      background:#004080;
    }

    .error{
      background:#ef4444;
      padding:12px;
      border-radius:10px;
      margin-bottom:20px;
      display:none;
      text-align:center;
    }

  </style>
</head>

<body>

<div class="login-box">

  <h1>
    <i class="fas fa-user-shield"></i>
    Admin Login
  </h1>

  <div class="error" id="errorMsg">
    Username atau Password salah!
  </div>

  <form onsubmit="login(event)">

    <div class="input-group">
      <input
      type="text"
      id="username"
      placeholder="Username"
      required>
    </div>

    <div class="input-group">
      <input
      type="password"
      id="password"
      placeholder="Password"
      required>
    </div>


    <button class="login-btn" id="loginBtn">
      Login
    </button>

  </form>

</div>

<script>
    const { createClient } = supabase

  const db = createClient(
    'https://frziffueiuosikmhyoae.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZyemlmZnVlaXVvc2lrbWh5b2FlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MTY0MDgsImV4cCI6MjA5NTI5MjQwOH0._G4TlPRL4EUps7qOWudkAcmUcKcPc42Q3kEtm2bQdhA'
  )

async function login(event){

    event.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const error    = document.getElementById("errorMsg");
    const btn      = document.getElementById("loginBtn");
    // Tampilkan loading
    btn.disabled   = true;
    btn.innerHTML  = '<i class="fas fa-spinner fa-spin"></i> Memuat...';
    error.style.display = "none";
    
    // Cek ke tabel "admin" di Supabase
    const { data, error: dbError } = await db
    .from("admin")
    .select("*")
    .eq("username", username)
    .eq("password", password)
    
    console.log("data:", data)
    console.log("error:", dbError)
    console.log("username input:", username)
    console.log("password input:", password)
    if(dbError || !data || data.length === 0){
      console.log(dbError)
      error.style.display = "block";
      btn.disabled  = false;
      btn.innerHTML = "Login";

    }else{

      localStorage.setItem("isLogin", "true");
      window.location.href = "dashboard.html";

    }

  }

</script>

</body>
</html>
